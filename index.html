<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xenin AI - Secure Enterprise Matrix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: #030712; color: #e2e8f0; height: 100vh; overflow: hidden; margin: 0; padding: 0; }
        .glass-card { background: rgba(8, 15, 30, 0.98); backdrop-filter: blur(20px); border: 1.5px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 40px rgba(56, 189, 248, 0.2); }
        .output-box { background-color: #010409; font-family: monospace; border: 1px solid #1e293b; }
        @keyframes pulse-intense { 0%, 100% { box-shadow: 0 0 20px rgba(56,189,248,0.5), inset 0 0 15px rgba(56,189,248,0.3); } 50% { box-shadow: 0 0 35px rgba(56,189,248,0.9), inset 0 0 25px rgba(56,189,248,0.5); } }
        .animate-pulse-intense { animation: pulse-intense 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-3 select-none">

    <!-- TOP SYSTEM STATUS -->
    <div class="w-full max-w-md mx-auto flex justify-between items-center py-1 px-1">
        <div class="flex items-center space-x-1">
            <span class="text-[9px] text-sky-400 font-bold uppercase tracking-widest">SYSTEM STATUS:</span>
            <span id="systemStatus" class="text-[9px] text-emerald-400 font-mono font-bold">● SECURE & STABLE</span>
        </div>
        <div class="text-[9px] text-slate-400 font-mono">BUILD v7.2.1-PROD</div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="w-full max-w-md mx-auto glass-card rounded-2xl p-6 shadow-2xl space-y-5 my-auto border border-sky-500/60">
        <div class="text-center space-y-2.5">
            <div class="w-20 h-20 mx-auto bg-[#08111f] rounded-2xl p-0.5 shadow-2xl flex items-center justify-center border border-sky-400/70 relative animate-pulse-intense">
                <div class="w-full h-full bg-[#030712] rounded-[14px] flex items-center justify-center relative overflow-hidden">
                    <svg class="w-11 h-11 text-sky-400 drop-shadow-[0_0_12px_rgba(56,189,248,0.9)]" viewBox="0 0 24 24" fill="none">
                        <polygon points="12 2, 20.5 7, 20.5 17, 12 22, 3.5 17, 3.5 7" stroke="#38bdf8" stroke-width="1.8" fill="rgba(56,189,248,0.15)"/>
                        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="900" font-family="sans-serif">X</text>
                    </svg>
                </div>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-widest text-white">XENIN AI</h1>
                <p class="text-[10px] text-sky-400 tracking-wider mt-0.5">ENTERPRISE AUTHENTICATION GATEWAY</p>
            </div>
        </div>

        <div class="space-y-4 pt-1">
            <div class="space-y-1.5">
                <label class="text-[10px] text-slate-300 font-semibold tracking-wider">OFFICIAL GMAIL ACCOUNT</label>
                <input type="email" id="gmailInput" placeholder="Enter valid gmail (e.g. name@gmail.com)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
            </div>
            <div class="space-y-1.5">
                <label class="text-[10px] text-slate-300 font-semibold tracking-wider">SECURE ACCESS TOKEN</label>
                <input type="password" id="passInput" placeholder="Enter secure password" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
            </div>
            <button onclick="handleSecureLogin()" class="w-full bg-gradient-to-r from-blue-600 to-sky-600 hover:from-blue-500 hover:to-sky-500 text-white font-bold py-4 rounded-xl text-xs shadow-xl shadow-blue-600/40 tracking-wider">
                ESTABLISH SECURE SESSION
            </button>
        </div>
        <div class="border-t border-slate-800/80 pt-3 text-center">
            <p class="text-[9px] text-slate-400 tracking-wider">ZERO-CRASH ERROR BOUNDARY ACTIVE</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardScreen" class="hidden w-full max-w-md mx-auto h-full flex flex-col justify-between py-2">
        <div class="flex justify-between items-center px-1 pb-2 border-b border-slate-800/80">
            <div>
                <h1 class="text-base font-bold tracking-wider text-sky-400">XENIN AI</h1>
                <p id="userEmailDisplay" class="text-[10px] text-slate-400 font-mono">user@gmail.com</p>
            </div>
            <button onclick="handleLogout()" class="bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg text-[11px]">
                Logout
            </button>
        </div>

        <div class="flex-1 overflow-y-auto space-y-3 py-3 pr-0.5">
            <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-1.5">
                <p class="text-xs font-bold text-emerald-400">DEVICE TELEMETRY & ACCESS STATUS</p>
                <div id="telemetryData" class="text-[10px] font-mono text-slate-300 space-y-0.5">
                    Scanning hardware profile...
                </div>
            </div>

            <div class="space-y-2">
                <p class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Live Security Diagnostics</p>
                <div id="moduleList" class="space-y-2 pb-16"></div>
            </div>
        </div>
    </div>

    <script>
        // Crash-proof modules definition
        const modules = [
            { id: 1, name: "Device Hardware Fingerprinting", desc: "Extracts CPU cores, platform specs, and memory architecture." },
            { id: 2, name: "Gmail Mailbox Domain Integrity", desc: "Validates secure syntax and active session state." },
            { id: 3, name: "Real-Time Network Latency Audit", desc: "Measures packet round-trip time and secure connection status." }
        ];

        window.onload = function() {
            try {
                const savedGmail = localStorage.getItem('xenin_auth_gmail');
                if(savedGmail) {
                    showDashboard(savedGmail);
                }
                renderModules();
            } catch (err) {
                console.error("Initialization Error caught safely:", err);
            }
        };

        function handleSecureLogin() {
            try {
                const gmailInput = document.getElementById('gmailInput');
                const passInput = document.getElementById('passInput');
                
                if(!gmailInput || !passInput) return;

                const email = gmailInput.value.trim().toLowerCase();
                const pass = passInput.value.trim();

                // Strict Gmail validation regex
                const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

                if(!email) {
                    alert("Error: Please provide a Gmail address.");
                    return;
                }

                if(!gmailRegex.test(email)) {
                    alert("Access Denied: Invalid email format. Only real '@gmail.com' addresses are allowed.");
                    return;
                }

                if(email.split('@')[0].length < 3) {
                    alert("Access Denied: Username portion is too short or invalid.");
                    return;
                }

                if(!pass || pass.length < 6) {
                    alert("Error: Password security key must be at least 6 characters.");
                    return;
                }

                localStorage.setItem('xenin_auth_gmail', email);
                showDashboard(email);
            } catch (err) {
                alert("Critical Execution Error prevented safely.");
                console.error(err);
            }
        }

        function showDashboard(email) {
            try {
                const display = document.getElementById('userEmailDisplay');
                if(display) display.innerText = `Account: ${email}`;

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');

                loadDeviceTelemetry();
            } catch (err) {
                console.error("Dashboard render error:", err);
            }
        }

        async function loadDeviceTelemetry() {
            try {
                const container = document.getElementById('telemetryData');
                if(!container) return;

                const cores = navigator.hardwareConcurrency || 'Unknown';
                const platform = navigator.platform || 'Encrypted OS';
                const memory = navigator.deviceMemory ? navigator.deviceMemory + ' GB+' : 'Standard Tier';
                const online = navigator.onLine ? 'Online (Secure)' : 'Offline';
                const screenRes = `${window.screen.width}x${window.screen.height}`;

                container.innerHTML = `
                    <div>• Platform: ${platform}</div>
                    <div>• CPU Cores / Threads: ${cores} Active</div>
                    <div>• Estimated RAM Allocation: ${memory}</div>
                    <div>• Screen Matrix: ${screenRes} px</div>
                    <div>• Network Status: ${online}</div>
                `;
            } catch (err) {
                document.getElementById('telemetryData').innerText = "Telemetry data secured via fallback protocols.";
            }
        }

        function executeDiagnostics(id) {
            try {
                alert(`Executing module diagnostic #${id} under secure supervisor permissions. Status: All parameters optimal.`);
            } catch (err) {
                console.error("Diagnostic execution error:", err);
            }
        }

        function renderModules() {
            try {
                const container = document.getElementById('moduleList');
                if(!container) return;
                container.innerHTML = '';
                
                modules.forEach(m => {
                    container.innerHTML += `
                        <div onclick="executeDiagnostics(${m.id})" class="glass-card p-3 rounded-xl border border-slate-800 active:border-sky-500 transition cursor-pointer flex justify-between items-center">
                            <div>
                                <h3 class="text-xs font-semibold text-slate-200">${m.id}. ${m.name}</h3>
                                <p class="text-[9px] text-slate-400 mt-0.5">${m.desc}</p>
                            </div>
                            <div class="text-[10px] font-bold text-sky-400 whitespace-nowrap">RUN</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Module render error:", err);
            }
        }

        function handleLogout() {
            try {
                localStorage.removeItem('xenin_auth_gmail');
                location.reload();
            } catch (err) {
                console.error("Logout error:", err);
            }
        }
    </script>
</body>
</html>
